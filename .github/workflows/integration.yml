name: Integration

# Exercises the package as PUBLISHED on Packagist, against staging. CI covers
# this working tree; nothing there would notice a `.gitattributes` that exports
# no `src`, an autoload map a consumer cannot resolve, or a tag that never
# landed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind
    # everyone else's and can be dropped entirely under load.
    - cron: '41 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none
      # No dependency cache: the point is the install a stranger gets. The script
      # skips with a reason when nothing is published yet, and the suite skips
      # from inside when the key is missing. A secret that does not exist
      # interpolates to an empty string here, which both treat as absent.
      - run: php scripts/run.php
        working-directory: integration
        env:
          INTERNETDATA_STAGING_KEY: ${{ secrets.INTERNETDATA_STAGING_KEY }}
